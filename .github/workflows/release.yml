name: Release

# Build the native game for macOS (Apple Silicon) + Windows (x64) and attach
# the builds to the release for the tag, in the studio's launcher convention:
# asset names end in -macos-aarch64.app.tar.gz / -windows-x86_64.zip. The
# launcher matches on those SUFFIXES, so the version may sit in the name.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build + attach assets to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write # create / update the release, upload assets

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon
            platform: macos-aarch64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release

      - name: Compute version (tag without leading v)
        id: ver
        shell: bash
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Package — macOS .app.tar.gz
        if: runner.os == 'macOS'
        run: |
          bash packaging/macos-app.sh target/release/fly-on-the-wall "${{ steps.ver.outputs.version }}" build
          mkdir -p dist
          tar -czf "dist/FlyOnTheWall-macos-aarch64.app.tar.gz" -C build FlyOnTheWall.app

      # Assets go BESIDE the exe for the same reason they go beside the binary
      # in the .app: Bevy finds its asset root from the executable's directory,
      # and a shipped build has no `CARGO_MANIFEST_DIR` to fall back on.
      - name: Package — Windows .zip (binary + assets)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, stage | Out-Null
          Copy-Item target\release\fly-on-the-wall.exe stage\FlyOnTheWall.exe
          Copy-Item -Recurse assets stage\assets
          Compress-Archive -Path stage\* -DestinationPath dist\FlyOnTheWall-windows-x86_64.zip -Force

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          fail_on_unmatched_files: true
